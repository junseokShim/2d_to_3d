<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tool 2D→3D</title>
<style>
:root{--bg:#f5f6f8;--fg:#1d2330;--mut:#667;--line:#d5d9e0;--acc:#1f5fbf;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg)}
main{display:grid;gap:16px;padding:16px;grid-template-columns:1fr}
@media(min-width:1000px){main{grid-template-columns:280px 1fr 1.3fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font-size:17px;margin:0 0 12px}
label.row{display:flex;align-items:center;gap:10px;margin:10px 0}
label.row span{width:90px}
select,button,.btn{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.hint{color:var(--mut);font-size:13px}
#slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.slot{border:1px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;font-size:13px}
.slot .th{height:110px;display:flex;align-items:center;justify-content:center;background:#eef0f3;border-radius:6px;color:var(--mut);overflow:hidden}
.slot .th canvas{max-height:110px;max-width:100%}
.qb{font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px}
.qb.q-pass{background:#e3f5e9;color:#16723a}.qb.q-warn{background:#fff4d6;color:#8a6200}.qb.q-fail{background:#fde4e2;color:#a8261e}.qb.q-run{background:#eef0f3;color:var(--mut)}
.qadv{margin:0;padding-left:16px;text-align:left;font-size:11px;color:var(--mut)}
#gl{width:100%;height:420px;background:#20242c;border-radius:8px;touch-action:none;display:block}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}
td{border-bottom:1px solid var(--line);padding:5px 4px}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#strips{display:flex;gap:6px;overflow-x:auto;margin-top:10px}#strips canvas{height:180px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;font-size:13px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:#1a73e8;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
#busy{font-size:13px;color:#555}#busy[hidden]{display:none}
#run:disabled{opacity:.6}
#msg{color:#b3261e;font-size:13px;min-height:1em;margin-top:8px}
#cam{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;color:#fff;overflow:auto}
#cam[hidden]{display:none}
#cam.flash .camwrap{opacity:.4}
#camtop{width:100%;max-width:720px;padding:6px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
#sharpbar{height:8px;background:#333;border-radius:4px;overflow:hidden}
#sharpbar i{display:block;height:100%;width:0;background:#e33;transition:width .15s}
#sharpbar i.ok{background:#e9a800}#sharpbar i.sharp{background:#1db954}
#camhint{min-height:2.6em}
.camwrap{position:relative;display:inline-block;overflow:hidden;touch-action:none}
#video{display:block;max-width:100vw;max-height:calc(100vh - 230px);transform-origin:50% 50%}
#guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gd{fill:none;stroke:#ffd400;stroke-width:3;stroke-dasharray:12 8;vector-effect:non-scaling-stroke}
#focusring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #fff;border-radius:50%;pointer-events:none}
#focusring.done{border-color:#1db954}#focusring[hidden]{display:none}
#zoomtag{position:absolute;left:8px;top:8px;background:#0008;padding:2px 6px;border-radius:4px;font-size:12px;pointer-events:none}
.camzoom,.camopts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:4px 12px;font-size:13px}
.camzoom input{width:min(260px,50vw)}
#zbtns button,#torch{background:#222;color:#fff;border-color:#555;padding:5px 10px}
#zbtns button.on,#torch.on{background:#ffd400;color:#000}
#cam select,#cam .btn{background:#222;color:#fff;border-color:#555}
.cambar{display:flex;gap:16px;align-items:center;padding:12px;color:#fff}
#shutter{width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:#e33}
#shutter.ok{background:#e9a800}#shutter.sharp{background:#1db954}
</style>
<link rel="stylesheet" href="css/metro.css"><link rel="stylesheet" href="css/post.css">
<script src="native/android-save.js"></script>
</head>
<body>
<main>
  <section>
    <h2>① 공구 정보</h2>
    <label class="row"><span>날 수(flute)</span><select id="flutes"></select></label>
    <label class="row"><span>공구경 φ</span><select id="dia"></select></label>
    <p class="hint">날 수 2~6, 공구경 4~12 mm</p>
  </section>

  <section>
    <h2>② 촬영 / 불러오기</h2>
    <p class="hint" id="slotHint">팁을 위로 두고 보조선에 공구 외곽을 맞춰 주세요. 날 수만큼 공구를 돌려가며 측면을 찍고, 마지막에 윗면(끝면)을 찍습니다.</p>
    <div id="slots"></div>
    <div class="ctl" id="multiRow"><label class="btn">여러 장 한번에 불러오기<input id="multi" type="file" accept="image/*" multiple hidden></label>
      <span class="hint">파일명 순서대로 측면 1…N, 윗면</span></div>
  </section>

  <section>
    <h2>③ 3D 화</h2>
    <button class="pri" id="run">3D 생성</button> <span id="busy" hidden><i class="spin"></i> 마모 분석 중… (AI 모델 첫 로드는 수 초 걸립니다)</span>
    <div id="msg"></div>
    <canvas id="gl"></canvas>
    <div class="ctl">
      <label>마모 민감도 <input id="sens" type="range" min="1" max="4" step="0.1" value="2.5"></label>
      <label>검사 범위(×D) <input id="zone" type="range" min="0.2" max="1.5" step="0.1" value="0.5"></label>
      <label title="카탈로그 헬릭스각. 비워 두면 사진에서 추정 (15–55°)">헬릭스각(°) <input id="helix" type="number" min="10" max="60" step="0.5" placeholder="자동" style="width:5em"></label>
    </div>
    <div id="engine" class="hint"></div>
    <table id="res"></table>
    <div class="ctl"><button id="dlStl">STL 저장</button><button id="dlTex">텍스처 PNG</button><button id="dlJson">결과 JSON</button><button id="dlInputs">입력 내보내기 (Export inputs)</button></div>
    <div id="strips"></div>
  </section>
  <section id="metro"></section>
  <!-- TODO(god): delete #post, js/post/**, css/post.css and test/post once the 3D post-processing views live in section ③ (worker-view3d); its 2D views are now in ④ (js/metro) -->
  <section id="post"></section>
</main>

<div id="cam" hidden>
  <div id="camtop"><div id="sharpbar" title="선명도"><i></i></div><span id="camhint">공구에서 10~15 cm 떨어져 줌으로 확대하세요. 화면을 탭하면 그 위치에 초점을 맞춥니다.</span></div>
  <div class="camwrap" id="camwrap"><video id="video" playsinline muted></video><svg id="guide" preserveAspectRatio="none"></svg><div id="focusring" hidden></div><div id="zoomtag"></div></div>
  <div class="camzoom"><span id="zbtns"></span><label>줌 <input id="zoom" type="range" min="1" max="8" step="0.1" value="1"></label></div>
  <div class="camopts"><select id="lens" hidden title="렌즈 선택"></select><button id="torch" hidden>조명</button>
    <label title="선명하고 흔들림이 없으면 자동으로 촬영"><input type="checkbox" id="autoShot"> 자동 촬영</label>
    <label title="가능하면 센서 최대 해상도 사진(ImageCapture)으로 촬영"><input type="checkbox" id="hiRes" checked> 고해상도</label>
    <span id="mfocus" hidden>수동 초점 <input id="focusDist" type="range"> <button id="afBtn">AF</button></span>
    <label class="btn" title="휴대폰 기본 카메라 앱(매크로 모드 사용 가능)으로 촬영">기본 카메라 앱<input id="nativeCam" type="file" accept="image/*" capture="environment" hidden></label></div>
  <div class="cambar"><button id="camClose">취소</button><button id="shutter" aria-label="촬영"></button><span id="camtxt"></span></div>
</div>

<script src="js/wear/wear-core.js"></script><script src="js/wear/wear.js"></script><script src="js/wear/ai-wear.js"></script><script src="js/wear/wear-post.js"></script><script src="js/wear/seg-wear.js"></script>
<script src="js/enhance/quality.js"></script><script src="js/enhance/enhance.js"></script>
<script src="js/capture/camera-core.js"></script><script src="js/capture/camera.js"></script>
<script src="js/metro/metro-core.js"></script><script src="js/metro/metro-vb.js"></script><script src="js/metro/metro-ui.js"></script><script src="js/metro/metro-report.js"></script>
<script>
const $ = s => document.querySelector(s);
const S = 30;                          // 정규화 해상도 px/mm
const CORE = {2: .55, 3: .6, 4: .65, 5: .7, 6: .72};  // 심압비 기본값(사진으로 측정 불가)
const st = {k: 4, D: 10, shots: [], hints: []};
let R = null;                          // 마지막 분석 결과

// ---------- ① 입력 ----------
for (let i = 2; i <= 6; i++) $('#flutes').add(new Option(i, i, i === 4, i === 4));
for (let i = 4; i <= 12; i++) $('#dia').add(new Option(i + ' φ', i, i === 10, i === 10));
$('#flutes').onchange = () => { st.shots = []; st.hints = []; renderSlots(); };
$('#dia').onchange = renderSlots;

// ---------- ② 촬영/불러오기 ----------
const cv = (w, h) => Object.assign(document.createElement('canvas'), {width: w, height: h});
const msg = t => $('#msg').textContent = t || '';

function thumb(src) {
  const W = src.naturalWidth || src.width, H = src.naturalHeight || src.height, c = cv(Math.round(110 * W / H), 110);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}

function renderSlots() {
  st.k = +$('#flutes').value; st.D = +$('#dia').value;
  const box = $('#slots'); box.innerHTML = '';
  for (let i = 0; i <= st.k; i++) {
    const d = document.createElement('div'); d.className = 'slot';
    d.innerHTML = `<div class="th">없음</div><b>${i === st.k ? '윗면' : `측면 ${i + 1} (${Math.round(i * 360 / st.k)}°)`}</b>
      <button>촬영</button><label class="btn">불러오기<input type="file" accept="image/*" hidden></label>`;
    if (st.shots[i]) d.querySelector('.th').replaceChildren(thumb(st.shots[i]));
    if (st.shots[i] && i < st.k) d.querySelector('.th').after(qualityBadge(i));
    d.querySelector('button').onclick = () => openCam(i);
    d.querySelector('input').onchange = e => loadFiles([...e.target.files], i);
    box.append(d);
  }
}

// 촬영 품질 배지 (js/enhance/quality.js): 사진을 불러오자마자 측면마다 pass/warn/fail + 재촬영 조언
const qCache = new WeakMap();           // shot -> {D, r}
const Q_LBL = {pass: '✓ 품질 양호', warn: '! 품질 주의', fail: '✕ 재촬영 권장'};
function shotQuality(i) {
  const s = st.shots[i], Q = window.Tool3D?.enhance?.quality, W = window.Tool3D?.wear; if (!s || !Q || !W?.toImage) return null;
  const c = qCache.get(s); if (c && c.D === st.D) return c.r;
  let r = null; try { r = Q.assess(W.toImage(s), {diameterMm: st.D}); } catch (e) { console.warn('quality:', e); }
  qCache.set(s, {D: st.D, r}); return r;
}
function qualityBadge(i) {
  const box = document.createElement('div'); box.className = 'qbox'; box.dataset.q = i;
  const fill = r => {
    if (!r) { box.innerHTML = ''; return; }
    box.dataset.verdict = r.verdict;
    const bad = r.checks.filter(c => c.level !== 'ok');
    box.innerHTML = `<div class="qb q-${r.verdict}" title="${bad.map(c => c.msg).join(' · ')}">${Q_LBL[r.verdict]}</div>` +
      (r.advice.length ? `<ul class="qadv">${r.advice.map(a => `<li>${a}</li>`).join('')}</ul>` : '');
  };
  const c = qCache.get(st.shots[i]);
  if (c && c.D === st.D) fill(c.r);
  else { box.innerHTML = '<div class="qb q-run">품질 확인 중…</div>'; setTimeout(() => fill(shotQuality(i)), 30 + 30 * i); }   // 무거운 계산은 썸네일을 그린 뒤
  return box;
}

async function loadFiles(files, start) {
  files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
  for (let j = 0; j < files.length && start + j <= st.k; j++) {
    const img = new Image(); img.src = URL.createObjectURL(files[j]); await img.decode();
    st.shots[start + j] = img; st.hints[start + j] = null;
  }
  renderSlots();
}
$('#multi').onchange = e => loadFiles([...e.target.files], 0);

let camSlot;
const guideOf = (i, w, h) => i === st.k
  ? {type: 'top', cx: w / 2, cy: h / 2, r: 0.2 * Math.min(w, h)}
  : {type: 'side', cx: w / 2, w: 0.3 * w, y0: 0.12 * h, y1: 0.88 * h};

// 카메라: js/capture/camera.js (광학/디지털 줌, 탭 초점, 선명도 미터, 렌즈/조명, 기본 카메라 앱)
async function openCam(i) {
  camSlot = i;
  await Tool3D.capture.open({
    guide: (w, h) => guideOf(i, w, h),
    label: i === st.k ? '끝면을 원 안에' : `측면 ${i + 1}: 외곽을 보조선에`,
    onShot: c => {
      st.shots[i] = c; st.hints[i] = guideOf(i, c.width, c.height); renderSlots();
      if (i < st.k && !st.shots[i + 1]) openCam(i + 1);   // 다음 면 이어서 촬영 (렌즈/줌 유지)
      else closeCam();
    },
    onFile: f => loadFiles([f], i),
    onError: msg
  });
}
function closeCam() { Tool3D.capture.close(); }

// ---------- 영상 처리 공통 ----------
function pix(src, maxDim) {
  const W = src.naturalWidth || src.width, H = src.naturalHeight || src.height, s = Math.min(1, maxDim / Math.max(W, H));
  const w = Math.round(W * s), h = Math.round(H * s), x = cv(w, h).getContext('2d', {willReadFrequently: true});
  x.drawImage(src, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = .299 * d[4 * i] + .587 * d[4 * i + 1] + .114 * d[4 * i + 2];
  return {w, h, d, g, s};
}
function sobel({w, h, g}) {
  const gx = new Float32Array(w * h), gy = new Float32Array(w * h);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    gx[i] = g[i - w + 1] + 2 * g[i + 1] + g[i + w + 1] - g[i - w - 1] - 2 * g[i - 1] - g[i + w - 1];
    gy[i] = g[i + w - 1] + 2 * g[i + w] + g[i + w + 1] - g[i - w - 1] - 2 * g[i - w] - g[i - w + 1];
  }
  return {gx, gy};
}
const pct = (a, p) => { const b = Float32Array.from(a).sort(); return b[Math.min(b.length - 1, Math.floor(p / 100 * b.length))]; };
const mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
// 세로에 가까운 에지만 (헬릭스 무늬 등 사선 에지 배제)
const vert = (gx, gy) => i => Math.abs(gy[i]) < .4 * Math.abs(gx[i]) ? Math.abs(gx[i]) : 0;
const isSkin = (r, g, b) => r > 95 && g > 40 && b > 20 && r - g > 15 && r - b > 15;

// 측면 사진: 회전각/중심/폭(스케일)/팁 위치 자동 검출 = Align 보정
function detectSide(src, hint) {
  const P = pix(src, 800), {w, h, d, s} = P, {gx, gy} = sobel(P), vx = vert(gx, gy);
  const hc = hint ? hint.cx * s : w / 2, hw = hint ? hint.w * s : 0;
  const [sepMin, sepMax] = hint ? [hw * .5, hw * 1.5] : [w * .06, w * .7];
  const y0 = Math.round(hint ? hint.y0 * s : .05 * h), y1 = Math.round(hint ? y0 + .65 * (hint.y1 - hint.y0) * s : .7 * h);
  const cand = [];
  for (let a = -12; a <= 12; a++) {
    const t = Math.tan(a * Math.PI / 180), P = new Float32Array(w);
    for (let y = y0; y < y1; y += 2) {
      const off = (y - h / 2) * t, row = y * w;
      for (let x = 0; x < w; x++) { const xs = Math.round(x + off); if (xs > 0 && xs < w - 1) P[x] += vx(row + xs); }
    }
    const Q = P.map((_, i) => { let v = 0; for (let j = -2; j <= 2; j++) v += P[Math.min(w - 1, Math.max(0, i + j))]; return v; });
    const mx = Math.max(...Q), pk = [];
    for (let i = 1; i < w - 1; i++) if (Q[i] >= Q[i - 1] && Q[i] > Q[i + 1] && Q[i] > .3 * mx) pk.push(i);
    pk.sort((p, q) => Q[q] - Q[p]).splice(12);
    for (const l of pk) for (const r of pk) {
      const sep = r - l;
      if (sep < sepMin || sep > sepMax || Math.abs((l + r) / 2 - hc) > (hint ? hw * .5 : .3 * w)) continue;
      cand.push({a, l, r, sep, sc: Math.min(Q[l], Q[r])});
    }
  }
  if (!cand.length) return null;
  const top = Math.max(...cand.map(c => c.sc));
  let b = cand.filter(c => c.sc >= .6 * top).sort((p, q) => q.sep - p.sep)[0];       // 강한 쌍 중 가장 바깥 = 실루엣
  b = cand.filter(c => Math.abs(c.sep - b.sep) < 4 && Math.abs(c.l + c.r - b.l - b.r) < 8).sort((p, q) => q.sc - p.sc)[0];
  const t = b.a * Math.PI / 180, ct = Math.cos(t), sn = Math.sin(t), xc = (b.l + b.r) / 2, sepP = b.sep * ct;
  const at = (u, v) => [Math.round(xc + u * ct + v * sn), Math.round(h / 2 - u * sn + v * ct)];
  const edge = (u, v) => { let m = 0; for (let j = -2; j <= 2; j++) { const [x, y] = at(u + j, v); if (x > 0 && y > 0 && x < w - 1 && y < h - 1) m = Math.max(m, vx(y * w + x)); } return m; };
  const vs = [], F = [], skin = [];
  for (let v = -h / 2; v < h / 2; v++) {
    const [x, y] = at(0, v); if (y < 1 || y >= h - 1) continue;
    vs.push(v); F.push(Math.min(edge(-sepP / 2, v), edge(sepP / 2, v)));
    let n = 0; for (let j = -7; j <= 7; j++) { const [x2, y2] = at(j * sepP / 20, v); const i = 4 * (y2 * w + x2); if (x2 >= 0 && x2 < w && isSkin(d[i], d[i + 1], d[i + 2])) n++; }
    skin.push(n / 15);
  }
  const win = Math.max(3, Math.round(.15 * sepP)), body = pct(F, 90);   // 공구 몸통의 에지 세기 기준
  let iT = 0; while (iT < F.length - win && mean(F.slice(iT, iT + win)) < .4 * body) iT++;
  let iE = iT + Math.round(.5 * sepP); while (iE < F.length - 1 && skin[iE] < .3) iE++;
  const ppm = sepP / st.D;
  return {t, xc, sepP, vTip: vs[iT], s, h, Lmm: Math.min(3 * st.D, (vs[iE] - vs[iT]) / ppm)};
}

// 검출 결과로 공구 축을 세로, 스케일 S px/mm로 정규화한 스트립 이미지 생성
function rectify(src, q, D, Lmm) {
  const m = .15 * D, mt = .3 * D, W = Math.round((D + 2 * m) * S), H = Math.round((Lmm + mt) * S), c = cv(W, H);
  const ppm = q.sepP / D, k = ppm / (S * q.s), ct = Math.cos(q.t), sn = Math.sin(q.t);
  const u0 = -(m + D / 2) * ppm, v0 = q.vTip - mt * ppm;

// 스트립 분석: 실측 외곽/팁, 결손(치핑) 깊이, 밝기 기반 마모, 헬릭스 텐서

}

let det = null;       // 사진별 정렬 결과 (슬라이더 변경 시 재사용)
let engine = '';      // 결과 표에 표시할 마모 측정 엔진
const AI_TIMEOUT_MS = 180000;
// 마모 측정: AI(PatchCore) 우선, 모델 로드 실패/시간 초과/모든 면 AI 실패(신뢰도 낮음)면 기존(classic) 경로
async function measureWear(shots, opts) {
  const W = window.Tool3D?.wear; if (!W) return 'none';
  const timeout = () => new Promise((_, bad) => setTimeout(() => bad(new Error('AI timeout')), AI_TIMEOUT_MS));
  const label = (name, errs) => { const bad = errs.map((e, i) => e ? i + 1 : 0).filter(Boolean); return name + (bad.length ? ` · classic on side ${bad.join(', ')}` : ''); };
  // 1) AI (Seg): trained segmentation network (flank wear / chipping / adhesion); sides it cannot read use the classic path
  if (W.seg && W.run) try {
    await Promise.race([W.seg.run(shots, opts), timeout()]);
    const errs = Tool3D.wearDebug?.aiErrors || [];   // per side: null = segmented by the network, else why it fell back
    if (errs.some(e => !e)) return label('AI (Seg)', errs);
    console.warn('wear seg: every side fell back', errs);
  } catch (e) { console.warn('wear seg unavailable, PatchCore next:', e); }
  // 2) AI (PatchCore): anomaly vs the unworn body of the same photo
  if (W.ai && W.run) try {
    await Promise.race([W.ai.run(shots, opts), timeout()]);
    const errs = Tool3D.wearDebug?.aiErrors || [];
    if (errs.some(e => !e)) return label('AI (PatchCore)', errs);
    console.warn('wear AI: every side fell back', errs);
  } catch (e) { console.warn('wear AI unavailable, classic used:', e); }
  try { W.run?.(shots, opts); return 'classic'; } catch (e) { console.warn('wear:', e); return 'none'; }
}

  R.mesh = buildMesh(D, k, sl, ph0, Lmm, Wt, Hs, Cs);
  R.atlas = atlas;
  view.set(R.mesh, atlas, Lmm);
  window.Tool3D && Tool3D.render && Tool3D.render.update({flutes: k, diameterMm: D, helixDeg: wr && wr.helixDeg || beta, handEst: -hand, phaseRad: -ph0});   // render hook (v0.1 azimuth runs left-handed: '/' flutes give hand=-1 here = RH). The photo-texture hand guess is unreliable (LH on RH tools): reported only; the viewer uses the user's RH/LH choice > wearResult.helixHand > RH
  window.Tool3D?.map3d?.run({shots: st.shots, flutes: k, diameterMm: D});   // per-face segmentation -> 3D (js/map3d)
}

// 파라메트릭 엔드밀 메쉬 (표시 좌표: y=공구축, 팁이 위)
function buildMesh(D, k, sl, ph0, L, Wt, Hs, Cs) {
  const Rr = D / 2, core = CORE[k], M = 120, NZ = Math.max(20, Math.round(L * 4));
  const rad = (a, z) => Rr * (core + (1 - core) * Math.pow((1 + Math.cos(k * (a - ph0 - sl * z))) / 2, .35));
  const AW = Wt, AH = Hs + Cs, pos = [], uv = [], idx = [];
  for (let j = 0; j <= NZ; j++) for (let m = 0; m <= M; m++) {
    const z = L * j / NZ, a = 2 * Math.PI * m / M, r = rad(a, z);
    pos.push(r * Math.sin(a), L / 2 - z, r * Math.cos(a)); uv.push(m / M, z * S / AH);
  }
  for (let j = 0; j < NZ; j++) for (let m = 0; m < M; m++) {
    const i = j * (M + 1) + m; idx.push(i, i + M + 2, i + 1, i, i + M + 1, i + M + 2);
  }
  const cap = (z, y, flip, capUV) => {
    const c = pos.length / 3; pos.push(0, y, 0); uv.push(capUV ? .5 * Cs / AW : .5 / AW, capUV ? (Hs + Cs / 2) / AH : (Hs - 1) / AH);
    for (let m = 0; m <= M; m++) {
      const a = 2 * Math.PI * m / M, r = rad(a, z), x = r * Math.sin(a), zz = r * Math.cos(a);
      pos.push(x, y, zz); uv.push(capUV ? (Cs / 2 + x / D * Cs) / AW : .5 / AW, capUV ? (Hs + Cs / 2 + zz / D * Cs) / AH : (Hs - 1) / AH);
      if (m < M) flip ? idx.push(c, c + m + 2, c + m + 1) : idx.push(c, c + m + 1, c + m + 2);
    }
  };
  cap(0, L / 2, false, true); cap(L, -L / 2, true, false);
  const nrm = new Float32Array(pos.length);
  for (let t = 0; t < idx.length; t += 3) {
    const [a, b, c] = [idx[t], idx[t + 1], idx[t + 2]].map(i => pos.slice(3 * i, 3 * i + 3));
    const u = b.map((v, i) => v - a[i]), v = c.map((v, i) => v - a[i]);
    const n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    for (const i of [idx[t], idx[t + 1], idx[t + 2]]) for (let j = 0; j < 3; j++) nrm[3 * i + j] += n[j];
  }
  return {pos: new Float32Array(pos), nrm, uv: new Float32Array(uv), idx: new Uint16Array(idx), L};
}

// ---------- WebGL 뷰어 ----------
const view = (() => {
  const c = $('#gl'), gl = c.getContext('webgl', {preserveDrawingBuffer: true});
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, `attribute vec3 p,n;attribute vec2 t;uniform mat4 M,Rm;varying vec2 vt;varying float l;
    void main(){gl_Position=M*vec4(p,1.);l=.35+.65*abs(normalize((Rm*vec4(n,0.)).xyz).z);vt=t;}`));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `precision mediump float;uniform sampler2D T;varying vec2 vt;varying float l;
    void main(){gl_FragColor=vec4(texture2D(T,vt).rgb*l,1.);}`));
  gl.linkProgram(pr); gl.useProgram(pr);
  const buf = (loc, data, n) => { gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const a = gl.getAttribLocation(pr, loc); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, n, gl.FLOAT, false, 0, 0); };
  let yaw = 0, pitch = .35, zoom = 1, L = 1, n = 0;
  function draw() {
    if (!n) return;
    c.width = c.clientWidth * devicePixelRatio; c.height = c.clientHeight * devicePixelRatio;
    gl.viewport(0, 0, c.width, c.height); gl.clearColor(.13, .14, .17, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), asp = c.width / c.height, sc = 1.7 * zoom / L;
    const Rw = [[cy, 0, sy], [sp * sy, cp, -sp * cy], [-cp * sy, sp, cp * cy]], f = [sc / asp, sc, -sc / 2];
    const M = new Float32Array(16), Rm = new Float32Array(16);
    for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) { M[q * 4 + r] = Rw[r][q] * f[r]; Rm[q * 4 + r] = Rw[r][q]; }
    M[15] = Rm[15] = 1;
    gl.uniformMatrix4fv(gl.getUniformLocation(pr, 'M'), false, M); gl.uniformMatrix4fv(gl.getUniformLocation(pr, 'Rm'), false, Rm);
    gl.drawElements(gl.TRIANGLES, n, gl.UNSIGNED_SHORT, 0);
  }
  const P = new Map(), dist = () => { const [a, b] = [...P.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
  c.onpointerdown = e => { c.setPointerCapture(e.pointerId); P.set(e.pointerId, [e.clientX, e.clientY]); };
  c.onpointermove = e => {
    if (!P.has(e.pointerId)) return;
    const p = P.get(e.pointerId), d0 = P.size === 2 ? dist() : 0;
    if (P.size === 1) { yaw += (e.clientX - p[0]) * .01; pitch = Math.max(-1.5, Math.min(1.5, pitch + (e.clientY - p[1]) * .01)); }
    P.set(e.pointerId, [e.clientX, e.clientY]);
    if (d0) zoom *= dist() / d0;
    draw();
  };
  c.onpointerup = c.onpointercancel = e => P.delete(e.pointerId);
  c.onwheel = e => { e.preventDefault(); zoom *= Math.exp(-e.deltaY * .001); draw(); };
  addEventListener('resize', draw);
  return {
    set(m, tex, len) {
      buf('p', m.pos, 3); buf('n', m.nrm, 3); buf('t', m.uv, 2);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.idx, gl.STATIC_DRAW);
      gl.bindTexture(gl.TEXTURE_2D, gl.createTexture()); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, tex);
      for (const [p, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, p, v);
      n = m.idx.length; L = len; draw();
    }
  };
})();

// ---------- 저장 ----------
function save(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
$('#dlStl').onclick = () => {
  if (!R) return;
  const {pos, idx, L} = R.mesh, n = idx.length / 3, b = new DataView(new ArrayBuffer(84 + 50 * n));
  b.setUint32(80, n, true);
  for (let t = 0; t < n; t++) for (let v = 0; v < 3; v++) {       // mm, z=공구축(팁 z=0)
    const i = idx[3 * t + v], o = 84 + 50 * t + 12 + 12 * v;
    b.setFloat32(o, pos[3 * i], true); b.setFloat32(o + 4, pos[3 * i + 2], true); b.setFloat32(o + 8, L / 2 - pos[3 * i + 1], true);
  }
  save('tool.stl', new Blob([b.buffer]));
};
$('#dlTex').onclick = () => R && R.atlas.toBlob(b => save('tool_texture.png', b));
$('#dlJson').onclick = () => { if (R) { const {mesh, atlas, ...o} = R; save('result.json', new Blob([JSON.stringify(o, null, 2)])); } };

// 입력 내보내기: 모든 사진 + params.json 을 zip(무압축 store) 하나로. Android 는 native/android-save.js 가 저장/공유 처리
const CRC = new Uint32Array(256).map((_, n) => { let c = n; for (let j = 0; j < 8; j++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c; });
function zipStore(files) {   // files: [{name, data: Uint8Array}] -> Blob (application/zip)
  const enc = new TextEncoder(), parts = [], cen = [], dt = new Date();
  const time = dt.getHours() << 11 | dt.getMinutes() << 5 | dt.getSeconds() >> 1, date = (dt.getFullYear() - 1980) << 9 | (dt.getMonth() + 1) << 5 | dt.getDate();
  let off = 0;
  for (const {name, data} of files) {
    const nm = enc.encode(name); let c = ~0; for (let i = 0; i < data.length; i++) c = CRC[(c ^ data[i]) & 255] ^ (c >>> 8); c = ~c >>> 0;
    const hdr = (sig, cd) => { const b = new DataView(new ArrayBuffer(cd ? 46 : 30)); let o = 0; const u32 = v => { b.setUint32(o, v, true); o += 4; }, u16 = v => { b.setUint16(o, v, true); o += 2; };
      u32(sig); if (cd) u16(20); u16(20); u16(0x800); u16(0); u16(time); u16(date); u32(c); u32(data.length); u32(data.length); u16(nm.length); u16(0);
      if (cd) { u16(0); u16(0); u16(0); u32(0); u32(off); } return new Uint8Array(b.buffer); };
    const lh = hdr(0x04034b50, false); parts.push(lh, nm, data); cen.push(hdr(0x02014b50, true), nm);
    off += lh.length + nm.length + data.length;
  }
  const cdLen = cen.reduce((s, b) => s + b.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdLen, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...cen, new Uint8Array(end.buffer)], {type: 'application/zip'});
}
async function shotBytes(s) {   // 불러온 파일은 원본 바이트 그대로, 카메라 촬영(canvas)은 JPEG
  const b = s.src ? await (await fetch(s.src)).blob() : await new Promise(ok => s.toBlob(ok, 'image/jpeg', .95));
  return {data: new Uint8Array(await b.arrayBuffer()), ext: (/png/.test(b.type) ? 'png' : /webp/.test(b.type) ? 'webp' : 'jpg')};
}
$('#dlInputs').onclick = async () => {
  const {k, D} = st, files = [], names = [];
  for (let i = 0; i <= k; i++) if (st.shots[i]) {
    const {data, ext} = await shotBytes(st.shots[i]), name = (i < k ? `side${i + 1}` : 'top') + '.' + ext;
    files.push({name, data}); names.push(name);
  }
  if (!files.length) return msg('내보낼 사진이 없습니다.');
  const params = {app: 'Tool3D', exportedAt: new Date().toISOString(), flutes: k, diameterMm: D, sens: +$('#sens').value, zoneXD: +$('#zone').value, helixDeg: +$('#helix').value || null,
    shots: names, hints: st.hints.slice(0, k + 1), engine: engine || null};
  files.push({name: 'params.json', data: new TextEncoder().encode(JSON.stringify(params, null, 2))});
  save('tool3d-inputs.zip', zipStore(files));
};
setTimeout(() => window.Tool3D?.wear?.ai?.load?.().catch(e => console.warn('wear AI preload:', e)), 1500);   // 첫 실행 대기 줄이기
